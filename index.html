<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>희창 퀴즈왕</title><style>*{box-sizing:border-box}body{margin:0;background:#101b36;color:#ffda35;font: bold 16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:16px}header,nav{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{text-align:center;font-size:34px;margin:16px}svg{width:100%;border-radius:18px;display:block}button{font:inherit;color:#fff38a;border:0;border-radius:16px;padding:18px 8px;box-shadow:0 5px 0 #0005;cursor:pointer;transition:transform .12s,box-shadow .12s}button:active{transform:translateY(5px);box-shadow:none}button:focus-visible{outline:3px solid white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.small{grid-template-columns:repeat(3,1fr)}.season{background:#ffc83d;color:#713c0d;padding:16px;border-radius:16px;margin:14px 0}nav button{background:#263c65;padding:12px 5px;flex:1}section{background:#263c65;padding:16px;border-radius:16px;margin:16px 0}input,select{width:100%;padding:12px;border-radius:10px;font:inherit;margin:8px 0}p{line-height:1.5}small{color:#dce5ff}button[disabled]{opacity:.6;cursor:default}</style><main><header><span>희창플레이어 · LV. 1</span><span>0 WP</span></header><h1>♛ 희창 퀴즈왕</h1><div id="lobby"><svg viewBox="0 0 340 230" role="img" aria-label="희창유업 공장 앞에서 곤약젤리를 먹는 황소"><rect width="340" height="230" fill="#a4dff5"/><circle cx="290" cy="30" r="19" fill="#fff2a1"/><path d="M0 130Q80 50 170 125Q260 55 340 120V230H0Z" fill="#8bc99b"/><path d="M0 170Q160 135 340 160V230H0Z" fill="#b8df8b"/><rect x="43" y="83" width="254" height="89" rx="6" fill="#fff4d9"/><path d="M32 85L70 59H270L308 85Z" fill="#427fce"/><rect x="104" y="94" width="132" height="24" rx="4" fill="white"/><text x="170" y="111" font-size="15" text-anchor="middle" fill="#285a9c">희창유업</text><g fill="#82c8ed"><rect x="57" y="132" width="23" height="23" rx="3"/><rect x="92" y="132" width="23" height="23" rx="3"/><rect x="224" y="132" width="23" height="23" rx="3"/><rect x="259" y="132" width="23" height="23" rx="3"/></g><g stroke="#80502e" stroke-width="2"><ellipse cx="147" cy="185" rx="41" ry="29" fill="#bc773d"/><rect x="120" y="199" width="19" height="19" rx="8" fill="#b8733a"/><rect x="164" y="199" width="19" height="19" rx="8" fill="#b8733a"/><path d="M114 126Q94 110 104 91Q111 111 130 112ZM171 112Q191 106 196 90Q204 113 185 128Z" fill="#fff0c7"/><ellipse cx="110" cy="133" rx="19" ry="10" fill="#c58a4e"/><ellipse cx="189" cy="133" rx="19" ry="10" fill="#c58a4e"/><rect x="112" y="109" width="77" height="67" rx="31" fill="#d89b50"/><ellipse cx="150" cy="158" rx="31" ry="20" fill="#f5c98c"/><circle cx="132" cy="136" r="4" fill="#35271e"/><circle cx="169" cy="136" r="4" fill="#35271e"/><path d="M142 164Q151 171 160 163" fill="none"/></g><g transform="translate(177 154) rotate(18)"><rect width="54" height="62" rx="9" fill="#f7a6c5" stroke="#b74e83" stroke-width="2"/><rect x="20" y="-9" width="14" height="12" rx="3" fill="white"/><rect x="4" y="12" width="46" height="33" rx="5" fill="#fff8f0"/><text x="27" y="25" font-size="10" fill="#bd4278" text-anchor="middle">슈가로로</text><text x="27" y="38" font-size="10" fill="#813052" text-anchor="middle">곤약젤리</text></g><path d="M160 164L201 150" stroke="white" stroke-width="4" stroke-linecap="round"/><rect x="235" y="84" width="93" height="32" rx="12" fill="white"/><text x="281" y="104" font-size="12" text-anchor="middle" fill="#80502e">젤리 맛있소!</text><g transform="translate(73 39) rotate(-16)"><rect x="-65" y="-20" width="130" height="40" rx="9" fill="#17396b" stroke="#ffda35" stroke-width="2"/><text y="6" text-anchor="middle" font-size="18" fill="#ffda35">희창 퀴즈왕</text></g></svg><p style="text-align:center">오늘의 퀴즈왕은 누구인가!</p><div class="season">🏆 SEASON 01 · 희창 최강자전</div><div class="grid"><button style="background:#f34d65" data-page="create">게임방 생성</button><button style="background:#16b99c" data-page="join">게임 참가</button></div><div class="grid small"><button style="background:#9658e8" data-page="shop">상점</button><button style="background:#f38a28" data-page="inventory">보관함</button><button style="background:#308be9" data-page="rank">랭킹</button></div></div><section id="panel" hidden></section><nav><button data-page="home">로비</button><button data-page="shop">상점</button><button data-page="inventory">보관함</button><button data-page="rank">랭킹</button><button data-page="profile">프로필</button></nav><p><small>기본 UI 시제품 · 실시간 연결 및 승점 지급 미구현</small></p></main><script>const panel=document.querySelector('#panel'),lobby=document.querySelector('#lobby');const pages={create:'<h2>게임방 생성</h2><label>게임 모드<select><option>일반전</option><option>아이템전</option></select></label><label>최대 참가자<select><option>10명</option><option>5명</option><option>2명</option></select></label><p>실시간 방 생성은 Firebase 연동 후 활성화됩니다.</p><button data-page="practice" style="background:#16b99c">혼자 연습하기</button>',join:'<h2>게임 참가</h2><label>방 코드<input maxlength="6" placeholder="방 코드 입력"></label><p>실시간 입장은 아직 연결되지 않았습니다.</p>',shop:'<h2>상점</h2><p>황소 감정표현 · 아이템 (준비 중)</p>',inventory:'<h2>보관함</h2><p>보유 아이템 없음</p>',rank:'<h2>랭킹</h2><p>시즌 기록 없음</p>',profile:'<h2>프로필</h2><p>희창플레이어 · LV. 1 · 0 WP</p>'};const qs=[['우유의 대표적인 무기질은?',['칼슘','철','요오드','구리'],0],['1시간은 몇 분인가?',['30','45','60','90'],2],['제품의 유통 및 보관 조건은 어디서 확인할까?',['색상','표시사항','가격','크기'],1]];let q=0,score=0,deadline=0,timer=null,locked=false;function stopTimer(){clearInterval(timer);timer=null}function question(){stopTimer();locked=false;if(q===qs.length){panel.innerHTML='<h2>연습 결과</h2><p>'+score+' / '+qs.length+' 정답</p><p>연습 모드는 WP를 지급하지 않습니다.</p><button data-page="home" style="background:#308be9">로비로</button>';return}let a=qs[q];deadline=Date.now()+15000;panel.innerHTML='<h2>연습 '+(q+1)+' / '+qs.length+'</h2><p id="clock" role="timer">15초</p><p>'+a[0]+'</p><div class="grid">'+a[1].map((v,i)=>'<button style="background:'+['#f34d65','#16B99C','#9658e8','#308be9'][i]+'" data-answer="'+i+'">'+v+'</button>').join('')+'</div>';timer=setInterval(()=>{let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));let c=document.querySelector('#clock');if(c)c.textContent=left+'초';if(!left&&!locked){locked=true;q++;question()}},200)}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.answer!==undefined){if(locked||q>=qs.length)return;locked=true;if(Date.now()<deadline&&+b.dataset.answer===qs[q][2])score++;q++;question();return}let p=b.dataset.page;if(!p)return;navigate(p)});let currentPage='home';history.replaceState({quizPage:'home'},'');function renderPage(p){stopTimer();currentPage=p;lobby.hidden=p!=='home';panel.hidden=p==='home';if(p==='practice'){q=0;score=0;question()}else if(p!=='home')panel.innerHTML='<button data-back="1" style="background:#263c65;padding:8px 16px">← 이전 화면</button>'+pages[p]}function navigate(p){if(p===currentPage)return;history.pushState({quizPage:p},'');renderPage(p)}window.addEventListener('popstate',e=>{renderPage(e.state?.quizPage||'home')});document.addEventListener('click',e=>{if(e.target.closest('[data-back]'))history.back()});</script><style>.arena{display:grid;grid-template-columns:1fr 2fr 1fr;gap:5px;align-items:start}.fighter{text-align:center;font-size:11px;padding:5px;background:#172846;border-radius:8px;margin:5px 0}.fighter svg{height:52px}.hp{height:7px;background:#101b36;border-radius:8px;overflow:hidden}.hp i{display:block;height:100%;background:#16b99c}.board{background:#101b36;border:2px solid #ffda35;border-radius:10px;padding:10px;text-align:center;overflow-wrap:anywhere}.hit{animation:shake .15s 5;color:#ff7777}@keyframes shake{50%{transform:translateX(4px) rotate(5deg)}}.botstart{background:#9658e8;width:100%}</style><script>
(()=>{const bank=[
['우유의 대표적인 무기질은?','칼슘','철','구리','요오드'],['손 씻기의 주된 목적은?','오염 감소','색상 변화','중량 증가','온도 상승'],['HACCP의 핵심 목적은?','식품 위해요소 관리','판매가격 결정','포장 디자인','광고 제작'],['페트리디시의 일반적인 용도는?','미생물 배양','중량 측정','압력 측정','온도 측정'],['탐침온도계의 용도는?','제품 내부 온도 측정','길이 측정','산도 측정','색도 측정'],['교차오염 예방에 적절한 방법은?','도구 구분 사용','모든 도구 혼용','손 씻기 생략','오염 구역 혼용'],['pH 7은 일반적으로 어떤 상태인가?','중성','강산성','강알칼리성','염분 포화'],['저울의 영점 확인 목적은?','측정 오차 감소','온도 상승','살균','점도 증가'],['식품 표시사항의 보관 조건은 왜 확인하는가?','적절한 보관을 위해','색상을 바꾸기 위해','가격을 올리기 위해','용량을 늘리기 위해'],['이물 혼입 발견 시 우선 조치는?','해당 제품 격리 및 보고','그대로 출고','기록 삭제','다른 제품과 혼합'],['품질 기록의 중요한 특성은?','정확성과 추적성','임의 수정','기록 생략','작성자 불명'],['멸균의 목적은?','미생물 제거 또는 사멸','수분 증가','색상 개선','중량 증가'],['냉장 보관의 일반적인 효과는?','미생물 증식 억제','모든 미생물 즉시 사멸','제품 무게 증가','산도 항상 중성화'],['스포이드의 용도는?','소량 액체 이동','고체 중량 측정','압력 측정','금속 절단'],['버니어캘리퍼스의 용도는?','치수 측정','온도 측정','미생물 배양','산도 측정'],['대장균군 검사는 일반적으로 무엇의 지표인가?','위생 상태','포장 색상','제품 가격','소음 수준'],['작업장 위생모의 목적은?','머리카락 혼입 예방','온도 측정','소음 측정','제품 냉각'],['선입선출의 의미는?','먼저 입고된 물품부터 사용','최근 입고품부터 사용','무작위 사용','가장 무거운 물품부터 사용'],['1시간은 몇 분인가?','60','30','45','90'],['1리터는 몇 밀리리터인가?','1000','100','10','10000']];
for(let i=1;i<=60;i++){let n=i+2;bank.push([n+' kg은 몇 g인가?',String(n*1000),String(n*100),String(n*10),String(n*10000)]);bank.push([n+'분은 몇 초인가?',String(n*60),String(n*30),String(n*100),String(n*10)]);bank.push([n+'개씩 4상자에 담으면 총 몇 개인가?',String(n*4),String(n*3),String(n*5),String(n*2)])}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let used=[];try{used=JSON.parse(localStorage.getItem('quizUsedV1')||'[]');if(!Array.isArray(used))used=[]}catch{}
function drawQuestions(n){let pool=bank.map((_,i)=>i).filter(i=>!used.includes(i));if(pool.length<n){used=[];pool=bank.map((_,i)=>i)}let ids=shuffle(pool).slice(0,n);used.push(...ids);try{localStorage.setItem('quizUsedV1',JSON.stringify(used))}catch{}return ids.map(i=>bank[i])}
let active=false,round=0,players=[],questions=[],jobs=[],answer=null,started=0,difficulty='mid',serial=0;const names=['나','공정왕','미생물왕','품질왕','황소왕','젤리왕','정비왕','퀴즈신','도전자','최강자'];const colors=['#8bcdbd','#fff','#20232c','#eee','#b97a43'];function later(fn,ms){let s=serial;jobs.push(setTimeout(()=>{if(active&&s===serial)fn()},ms))}function cancel(){active=false;serial++;jobs.forEach(clearTimeout);jobs=[]}
function avatar(i){return '<svg viewBox="0 0 70 65"><rect x="19" y="39" width="32" height="20" rx="7" fill="'+colors[i%5]+'"/><rect x="23" y="55" width="10" height="9" rx="3" fill="#566078"/><rect x="37" y="55" width="10" height="9" rx="3" fill="#566078"/><rect x="12" y="5" width="46" height="40" rx="17" fill="#ffd3aa"/><path d="M12 22Q8 0 35 1Q62 0 58 22L42 12L24 15Z" fill="#49332a"/><circle cx="26" cy="25" r="2" fill="#302633"/><circle cx="44" cy="25" r="2" fill="#302633"/><path d="M29 33Q35 39 41 33" stroke="#9d4a42" fill="none"/></svg>'}
function fighters(side){return players.map((p,i)=>({p,i})).filter(x=>x.i%2===side).map(({p,i})=>'<div class="fighter" id="f'+i+'">'+avatar(i)+names[i]+'<div class="hp"><i style="width:'+p.hp+'%"></i></div><span>'+p.hp+' HP</span></div>').join('')}
function refresh(){for(let i=0;i<players.length;i++){let el=document.getElementById('f'+i);if(el){el.querySelector('i').style.width=players[i].hp+'%';el.querySelector('span').textContent=players[i].hp?players[i].hp+' HP':'KO';if(players[i].hit){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');players[i].hit=false}}}}
function finish(){cancel();let order=players.map((p,i)=>({p,i})).sort((a,b)=>b.p.hp-a.p.hp||b.p.correct-a.p.correct);panel.innerHTML='<h2>AI 대결 결과</h2>'+order.map((x,i)=>'<p>'+(i+1)+'위 '+names[x.i]+' · '+x.p.hp+' HP · 정답 '+x.p.correct+'</p>').join('')+'<p>AI 연습전은 WP를 지급하지 않습니다.</p><button data-page="home" style="background:#308be9">로비로</button>'}
function damage(ms){return ms<=1000?20:ms<=3000?15:ms<=5000?10:ms<=10000?5:2}
function next(){if(round>=questions.length||players[0].hp===0||players.filter(p=>p.hp>0).length<=1){finish();return}let a=questions[round],opts=shuffle(a.slice(1));answer=null;started=performance.now();let responses=[];panel.innerHTML='<button data-back="1" style="background:#263c65;padding:8px">← 이전 화면</button><div class="arena"><div>'+fighters(0)+'</div><div class="board"><small>ROUND '+(round+1)+' / '+questions.length+'</small><h3>'+a[0]+'</h3><p id="botclock">15초</p><p id="battlelog">정답을 선택하세요</p></div><div>'+fighters(1)+'</div></div><div class="grid">'+opts.map((v,i)=>'<button data-botanswer="'+i+'" style="background:'+['#f34d65','#16b99c','#9658e8','#308be9'][i]+'">'+v+'</button>').join('')+'</div>';let buttons=panel.querySelectorAll('[data-botanswer]');buttons.forEach(b=>b.onclick=()=>{if(answer!==null)return;answer=+b.dataset.botanswer;responses.push({i:0,ms:performance.now()-started,ok:opts[answer]===a[1]});buttons.forEach(x=>x.disabled=true);document.getElementById('battlelog').textContent='답변 제출 완료'});let chance={easy:.45,mid:.65,hard:.85}[difficulty];players.forEach((p,i)=>{if(i&&p.hp>0){let ms=({easy:5000,mid:2500,hard:800}[difficulty])+Math.random()*6000;later(()=>responses.push({i,ms,ok:Math.random()<chance}),ms)}});for(let t=1;t<=15;t++)later(()=>{let e=document.getElementById('botclock');if(e)e.textContent=(15-t)+'초'},t*1000);later(()=>{buttons.forEach(x=>x.disabled=true);let correct=responses.filter(x=>x.ok).sort((a,b)=>a.ms-b.ms);players.forEach((p,i)=>{if(!p.hp)return;let own=responses.find(x=>x.i===i);if(own?.ok)p.correct++;let loss=own?(own.ok?0:10):5;loss+=correct.filter(x=>x.i!==i&&(!own?.ok||x.ms<own.ms)).reduce((s,x)=>s+damage(x.ms),0);loss=Math.min(20,loss);p.hp=Math.max(0,p.hp-loss);p.hit=loss>0});refresh();document.getElementById('battlelog').textContent=(correct.length?names[correct[0].i]+' 선제 공격! · ':'')+'정답: '+a[1];round++;later(next,1800)},15000)}
function setup(){panel.innerHTML='<button data-back="1" style="background:#263c65;padding:8px">← 이전 화면</button><h2>AI 봇 대결</h2><label>참가 인원<select id="botcount"><option>2</option><option>4</option><option>6</option><option selected>10</option></select></label><label>난이도<select id="botdifficulty"><option value="easy">초급</option><option value="mid" selected>중급</option><option value="hard">고급</option></select></label><label>문제 수<select id="botrounds"><option>5</option><option>10</option><option selected>20</option></select></label><button class="botstart" id="startbots">대결 시작</button>';document.getElementById('startbots').onclick=()=>{cancel();difficulty=document.getElementById('botdifficulty').value;players=Array.from({length:+document.getElementById('botcount').value},()=>({hp:100,correct:0}));questions=drawQuestions(+document.getElementById('botrounds').value);round=0;active=true;next()}}
pages.bots='';const original=renderPage;renderPage=function(p){cancel();original(p);if(p==='bots')setup()};const b=document.createElement('button');b.className='botstart';b.dataset.page='bots';b.textContent='AI 봇 대결';lobby.insertBefore(b,lobby.querySelector('.grid.small'));pages.create=pages.create.replace('</button>','</button><button data-page="bots" class="botstart">AI 봇 대결</button>');
})();
</script></html>
