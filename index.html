<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>희창 퀴즈왕</title><style>*{box-sizing:border-box}body{margin:0;background:#101b36;color:#ffda35;font: bold 16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:16px}header,nav{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{text-align:center;font-size:34px;margin:16px}svg{width:100%;border-radius:18px;display:block}button{font:inherit;color:#fff38a;border:0;border-radius:16px;padding:18px 8px;box-shadow:0 5px 0 #0005;cursor:pointer;transition:transform .12s,box-shadow .12s}button:active{transform:translateY(5px);box-shadow:none}button:focus-visible{outline:3px solid white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.small{grid-template-columns:repeat(3,1fr)}.season{background:#ffc83d;color:#713c0d;padding:16px;border-radius:16px;margin:14px 0}nav button{background:#263c65;padding:12px 5px;flex:1}section{background:#263c65;padding:16px;border-radius:16px;margin:16px 0}input,select{width:100%;padding:12px;border-radius:10px;font:inherit;margin:8px 0}p{line-height:1.5}small{color:#dce5ff}button[disabled]{opacity:.6;cursor:default}</style><main><header><span>희창플레이어 · LV. 1</span><span>0 WP</span></header><h1>♛ 희창 퀴즈왕</h1><div id="lobby"><svg viewBox="0 0 340 230" role="img" aria-label="희창유업 공장 앞에서 곤약젤리를 먹는 황소"><rect width="340" height="230" fill="#a4dff5"/><circle cx="290" cy="30" r="19" fill="#fff2a1"/><path d="M0 130Q80 50 170 125Q260 55 340 120V230H0Z" fill="#8bc99b"/><path d="M0 170Q160 135 340 160V230H0Z" fill="#b8df8b"/><rect x="43" y="83" width="254" height="89" rx="6" fill="#fff4d9"/><path d="M32 85L70 59H270L308 85Z" fill="#427fce"/><rect x="104" y="94" width="132" height="24" rx="4" fill="white"/><text x="170" y="111" font-size="15" text-anchor="middle" fill="#285a9c">희창유업</text><g fill="#82c8ed"><rect x="57" y="132" width="23" height="23" rx="3"/><rect x="92" y="132" width="23" height="23" rx="3"/><rect x="224" y="132" width="23" height="23" rx="3"/><rect x="259" y="132" width="23" height="23" rx="3"/></g><g stroke="#80502e" stroke-width="2"><ellipse cx="147" cy="185" rx="41" ry="29" fill="#bc773d"/><rect x="120" y="199" width="19" height="19" rx="8" fill="#b8733a"/><rect x="164" y="199" width="19" height="19" rx="8" fill="#b8733a"/><path d="M114 126Q94 110 104 91Q111 111 130 112ZM171 112Q191 106 196 90Q204 113 185 128Z" fill="#fff0c7"/><ellipse cx="110" cy="133" rx="19" ry="10" fill="#c58a4e"/><ellipse cx="189" cy="133" rx="19" ry="10" fill="#c58a4e"/><rect x="112" y="109" width="77" height="67" rx="31" fill="#d89b50"/><ellipse cx="150" cy="158" rx="31" ry="20" fill="#f5c98c"/><circle cx="132" cy="136" r="4" fill="#35271e"/><circle cx="169" cy="136" r="4" fill="#35271e"/><path d="M142 164Q151 171 160 163" fill="none"/></g><g transform="translate(177 154) rotate(18)"><rect width="54" height="62" rx="9" fill="#f7a6c5" stroke="#b74e83" stroke-width="2"/><rect x="20" y="-9" width="14" height="12" rx="3" fill="white"/><rect x="4" y="12" width="46" height="33" rx="5" fill="#fff8f0"/><text x="27" y="25" font-size="10" fill="#bd4278" text-anchor="middle">슈가로로</text><text x="27" y="38" font-size="10" fill="#813052" text-anchor="middle">곤약젤리</text></g><path d="M160 164L201 150" stroke="white" stroke-width="4" stroke-linecap="round"/><rect x="235" y="84" width="93" height="32" rx="12" fill="white"/><text x="281" y="104" font-size="12" text-anchor="middle" fill="#80502e">젤리 맛있소!</text><g transform="translate(73 39) rotate(-16)"><rect x="-65" y="-20" width="130" height="40" rx="9" fill="#17396b" stroke="#ffda35" stroke-width="2"/><text y="6" text-anchor="middle" font-size="18" fill="#ffda35">희창 퀴즈왕</text></g></svg><p style="text-align:center">오늘의 퀴즈왕은 누구인가!</p><div class="season">🏆 SEASON 01 · 희창 최강자전</div><div class="grid"><button style="background:#f34d65" data-page="create">게임방 생성</button><button style="background:#16b99c" data-page="join">게임 참가</button></div><div class="grid small"><button style="background:#9658e8" data-page="shop">상점</button><button style="background:#f38a28" data-page="inventory">보관함</button><button style="background:#308be9" data-page="rank">랭킹</button></div></div><section id="panel" hidden></section><nav><button data-page="home">로비</button><button data-page="shop">상점</button><button data-page="inventory">보관함</button><button data-page="rank">랭킹</button><button data-page="profile">프로필</button></nav><p><small>기본 UI 시제품 · 실시간 연결 및 승점 지급 미구현</small></p></main><script>const panel=document.querySelector('#panel'),lobby=document.querySelector('#lobby');const pages={create:'<h2>게임방 생성</h2><label>게임 모드<select><option>일반전</option><option>아이템전</option></select></label><label>최대 참가자<select><option>10명</option><option>5명</option><option>2명</option></select></label><p>실시간 방 생성은 Firebase 연동 후 활성화됩니다.</p><button data-page="practice" style="background:#16b99c">혼자 연습하기</button>',join:'<h2>게임 참가</h2><label>방 코드<input maxlength="6" placeholder="방 코드 입력"></label><p>실시간 입장은 아직 연결되지 않았습니다.</p>',shop:'<h2>상점</h2><p>황소 감정표현 · 아이템 (준비 중)</p>',inventory:'<h2>보관함</h2><p>보유 아이템 없음</p>',rank:'<h2>랭킹</h2><p>시즌 기록 없음</p>',profile:'<h2>프로필</h2><p>희창플레이어 · LV. 1 · 0 WP</p>'};const qs=[['우유의 대표적인 무기질은?',['칼슘','철','요오드','구리'],0],['1시간은 몇 분인가?',['30','45','60','90'],2],['제품의 유통 및 보관 조건은 어디서 확인할까?',['색상','표시사항','가격','크기'],1]];let q=0,score=0;function question(){if(q===qs.length){panel.innerHTML='<h2>연습 결과</h2><p>'+score+' / '+qs.length+' 정답</p><p>연습 모드는 WP를 지급하지 않습니다.</p><button data-page="home" style="background:#308be9">로비로</button>';return}let a=qs[q];panel.innerHTML='<h2>연습 '+(q+1)+' / '+qs.length+'</h2><p>'+a[0]+'</p><div class="grid">'+a[1].map((v,i)=>'<button style="background:'+['#f34d65','#16B99C','#9658e8','#308be9'][i]+'" data-answer="'+i+'">'+v+'</button>').join('')+'</div>'}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.answer!==undefined){if(+b.dataset.answer===qs[q][2])score++;q++;question();return}let p=b.dataset.page;if(!p)return;lobby.hidden=p!=='home';panel.hidden=p==='home';if(p==='practice'){q=0;score=0;question()}else if(p!=='home')panel.innerHTML=pages[p]});</script></html>
