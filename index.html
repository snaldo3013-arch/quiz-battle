 data-page="profile">프로필</button></nav><p><small>기본 UI 시제품 · 실시간 연결 및 승점 지급 미구현</small></p></main><script>const panel=document.querySelector('#panel'),lobby=document.querySelector('#lobby');const pages={create:'<h2>게임방 생성</h2><label>게임 모드<select><option>일반전</option><option>아이템전</option></select></label><label>최대 참가자<select><option>10명</option><option>5명</option><option>2명</option></select></label><p>실시간 방 생성은 Firebase 연동 후 활성화됩니다.</p><button data-page="practice" style="background:#16b99c">혼자 연습하기</button>',join:'<h2>게임 참가</h2><label>방 코드<input maxlength="6" placeholder="방 코드 입력"></label><p>실시간 입장은 아직 연결되지 않았습니다.</p>',shop:'<h2>상점</h2><p>황소 감정표현 · 아이템 (준비 중)</p>',inventory:'<h2>보관함</h2><p>보유 아이템 없음</p>',rank:'<h2>랭킹</h2><p>시즌 기록 없음</p>',profile:'<h2>프로필</h2><p>희창플레이어 · LV. 1 · 0 WP</p>'};const qs=[['우유의 대표적인 무기질은?',['칼슘','철','요오드','구리'],0],['1시간은 몇 분인가?',['30','45','60','90'],2],['제품의 유통 및 보관 조건은 어디서 확인할까?',['색상','표시사항','가격','크기'],1]];let q=0,score=0,deadline=0,timer=null,locked=false;function stopTimer(){clearInterval(timer);timer=null}function question(){stopTimer();locked=false;if(q===qs.length){panel.innerHTML='<h2>연습 결과</h2><p>'+score+' / '+qs.length+' 정답</p><p>연습 모드는 WP를 지급하지 않습니다.</p><button data-page="home" style="background:#308be9">로비로</button>';return}let a=qs[q];deadline=Date.now()+15000;panel.innerHTML='<button data-back="1" style="background:#263c65;padding:8px">← 이전 화면</button><h2>연습 '+(q+1)+' / '+qs.length+'</h2><p id="clock" role="timer">15초</p><p>'+a[0]+'</p><div class="grid">'+a[1].map((v,i)=>'<button style="background:'+['#f34d65','#16B99C','#9658e8','#308be9'][i]+'" data-answer="'+i+'">'+v+'</button>').join('')+'</div>';timer=setInterval(()=>{let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));let c=document.querySelector('#clock');if(c)c.textContent=left+'초';if(!left&&!locked){locked=true;q++;question()}},200)}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.answer!==undefined){if(locked||q>=qs.length)return;locked=true;if(Date.now()<deadline&&+b.dataset.answer===qs[q][2])score++;q++;question();return}let p=b.dataset.page;if(!p)return;navigate(p)});let currentPage='home';history.replaceState({quizPage:'home'},'');function renderPage(p){stopTimer();currentPage=p;lobby.hidden=p!=='home';panel.hidden=p==='home';if(p==='practice'){q=0;score=0;question()}else if(p!=='home')panel.innerHTML='<button data-back="1" style="background:#263c65;padding:8px 16px">← 이전 화면</button>'+pages[p]}function playing(){return (currentPage==='practice'&&q<qs.length)||!!panel.querySelector('#botclock')}let exitPending=false;function askExit(yes,no=()=>{}){if(exitPending)return;exitPending=true;const d=document.createElement('dialog');d.style.cssText='background:#263c65;color:#ffda35;border:2px solid #ffda35;border-radius:20px;padding:24px;width:min(90vw,360px);text-align:center';d.innerHTML='<h2>공정 돌러 가냐?</h2><p style="color:white">진행 중인 게임에서 나가시겠습니까?</p><div class="grid"><button style="background:#f34d65" id="exitYes">네</button><button style="background:#16b99c" id="exitNo">아니요</button></div>';document.body.append(d);function done(ok){d.close();d.remove();exitPending=false;ok?yes():no()}d.querySelector('#exitYes').onclick=()=>done(true);d.querySelector('#exitNo').onclick=()=>done(false);d.addEventListener('cancel',e=>{e.preventDefault();done(false)});d.showModal()}function navigate(p){if(p===currentPage)return;const go=()=>{history.pushState({quizPage:p},'');renderPage(p)};if(playing())askExit(go);else go()}window.addEventListener('popstate',e=>{const target=e.state?.quizPage||'home';if(playing()&&target!==currentPage){history.pushState({quizPage:currentPage},'');askExit(()=>{history.replaceState({quizPage:target},'');renderPage(target)})}else if(target!==currentPage)renderPage(target)});document.addEventListener('click',e=>{if(e.target.closest('[data-back]'))history.back()});</script><style>.arena{display:grid;grid-template-columns:1fr 2fr 1fr;gap:5px;align-items:start}.fighter{text-align:center;font-size:11px;padding:5px;background:#172846;border-radius:8px;margin:5px 0}.fighter svg{height:52px}.hp{height:7px;background:#101b36;border-radius:8px;overflow:hidden}.hp i{display:block;height:100%;background:#16b99c}.board{background:#101b36;border:2px solid #ffda35;border-radius:10px;padding:10px;text-align:center;overflow-wrap:anywhere}.hit{animation:shake .15s 5;color:#ff7777}@keyframes shake{50%{transform:translateX(4px) rotate(5deg)}}.botstart{background:#9658e8;width:100%}</style><script>
(()=>{const bank=[

for(let i=1;i<=60;i++){let n=i+2;bank.push([n+' kg은 몇 g인가?',String(n*1000),String(n*100),String(n*10),String(n*10000)]);bank.push([n+'분은 몇 초인가?',String(n*60),String(n*30),String(n*100),String(n*10)]);bank.push([n+'개씩 4상자에 담으면 총 몇 개인가?',String(n*4),String(n*3),String(n*5),String(n*2)])}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let used=[];try{used=JSON.parse(localStorage.getItem('quizUsedV1')||'[]');if(!Array.isArray(used))used=[]}catch{}
function drawQuestions(n){let pool=bank.map((_,i)=>i).filter(i=>!used.includes(i));if(pool.length<n){used=[];pool=bank.map((_,i)=>i)}let ids=shuffle(pool).slice(0,n);used.push(...ids);try{localStorage.setItem('quizUsedV1',JSON.stringify(used))}catch{}return ids.map(i=>bank[i])}
let map='office';let active=false,round=0,players=[],questions=[],jobs=[],answer=null,started=0,difficulty='mid',serial=0;const names=['나','공정왕','미생물왕','품질왕','황소왕','젤리왕','정비왕','퀴즈신','도전자','최강자'];const colors=['#8bcdbd','#fff','#20232c','#eee','#b97a43'];function later(fn,ms){let s=serial;jobs.push(setTimeout(()=>{if(active&&s===serial)fn()},ms))}function cancel(){active=false;serial++;jobs.forEach(clearTimeout);jobs=[]}
function avatar(i){return '<svg viewBox="0 0 70 65"><rect x="19" y="39" width="32" height="20" rx="7" fill="'+colors[i%5]+'"/><rect x="23" y="55" width="10" height="9" rx="3" fill="#566078"/><rect x="37" y="55" width="10" height="9" rx="3" fill="#566078"/><rect x="12" y="5" width="46" height="40" rx="17" fill="#ffd3aa"/><path d="M12 22Q8 0 35 1Q62 0 58 22L42 12L24 15Z" fill="#49332a"/><circle cx="26" cy="25" r="2" fill="#302633"/><circle cx="44" cy="25" r="2" fill="#302633"/><path d="M29 33Q35 39 41 33" stroke="#9d4a42" fill="none"/></svg>'}
function fighters(side){return players.map((p,i)=>({p,i})).filter(x=>x.i%2===side).map(({p,i})=>'<div class="fighter" id="f'+i+'">'+avatar(i)+names[i]+'<div class="hp"><i style="width:'+p.hp+'%"></i></div><span>'+p.hp+' HP</span></div>').join('')}

function finish(){cancel();let order=players.map((p,i)=>({p,i})).sort((a,b)=>b.p.hp-a.p.hp||b.p.correct-a.p.correct);panel.innerHTML='<h2>AI 대결 결과</h2>'+order.map((x,i)=>'<p>'+(i+1)+'위 '+names[x.i]+' · '+x.p.hp+' HP · 정답 '+x.p.correct+'</p>').join('')+'<p>AI 연습전은 WP를 지급하지 않습니다.</p><button data-page="home" style="background:#308be9">로비로</button>'}
function damage(ms){return ms<=1000?20:ms<=3000?15:ms<=5000?10:ms<=10000?5:2}
function next(){if(round>=questions.length||players[0].hp===0||players.filter(p=>p.hp>0).length<=1){finish();return}let a=questions[round],opts=shuffle(a.slice(1));answer=null;started=performance.now();let responses=[];panel.innerHTML='<button data-back="1" style="background:#263c65;padding:8px">← 이전 화면</button><div class="arena map-'+map+'"><div>'+fighters(0)+'</div><div class="board"><small>'+({office:'사무실',factory:'생산 현장',parking:'주차장'}[map])+' · ROUND '+(round+1)+' / '+questions.length+'</small><h3>'+a[0]+'</h3><p id="botclock">15초</p><p id="battlelog">정답을 선택하세요</p></div><div>'+fighters(1)+'</div></div><div class="grid">'+opts.map((v,i)=>'<button data-botanswer="'+i+'" style="background:'+['#f34d65','#16b99c','#9658e8','#308be9'][i]+'">'+v+'</button>').join('')+'</div>';let buttons=panel.querySelectorAll('[data-botanswer]');buttons.forEach(b=>b.onclick=()=>{if(answer!==null)return;answer=+b.dataset.botanswer;responses.push({i:0,ms:performance.now()-started,ok:opts[answer]===a[1]});buttons.forEach(x=>x.disabled=true);document.getElementById('battlelog').textContent='답변 제출 완료'});let chance={easy:.45,mid:.65,hard:.85}[difficulty];players.forEach((p,i)=>{if(i&&p.hp>0){let ms=({easy:5000,mid:2500,hard:800}[difficulty])+Math.random()*6000;later(()=>responses.push({i,ms,ok:Math.random()<chance}),ms)}});for(let t=1;t<=15;t++)later(()=>{let e=document.getElementById('botclock');if(e)e.textContent=(15-t)+'초'},t*1000);later(()=>{buttons.forEach(x=>x.disabled=true);let correct=responses.filter(x=>x.ok).sort((a,b)=>a.ms-b.ms);players.forEach((p,i)=>{if(!p.hp)return;let own=responses.find(x=>x.i===i);if(own?.ok)p.correct++;let loss=own?(own.ok?0:10):5;loss+=correct.filter(x=>x.i!==i&&(!own?.ok||x.ms<own.ms)).reduce((s,x)=>s+damage(x.ms),0);loss=Math.min(20,loss);p.hp=Math.max(0,p.hp-loss);p.hit=loss>0});refresh();document.getElementById('battlelog').textContent=(correct.length?names[correct[0].i]+' 선제 공격! · ':'')+'정답: '+a[1];round++;later(next,1800)},15000)}
